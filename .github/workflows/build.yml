# Every push and pull request: vet, test and build osureq.exe (kept as a
# workflow artifact for 14 days).
# A tag v1.2.3: the same build with version 1.2.3, published as a GitHub
# release with osureq-1.2.3-windows-x64.zip (exe, LICENSE and third-party
# licenses) and its SHA-256.
# Actions -> build -> Run workflow on main with a version (1.2.3): the same
# release, and the tag v1.2.3 is created on that commit (no git needed).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release this commit as version x.y.z (empty: just build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          elseif ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION.Trim().TrimStart("v")
            if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Version must look like 1.2.3, got '$v'"; exit 1 }
            if ($env:GITHUB_REF -ne "refs/heads/main") { Write-Error "Releases are made from main only"; exit 1 }
            $default = (Select-String -Path build.ps1 -Pattern '\[string\]\$Version = "([^"]+)"').Matches[0].Groups[1].Value
            if ($default -ne $v) { Write-Error "build.ps1 says ${default}: bump the version (build.ps1, changelog) before releasing $v"; exit 1 }
          }
          else { $v = "0.0.0-dev+" + $env:GITHUB_SHA.Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT

      # build.ps1 runs go vet and go test, writes the Windows resources and builds dist\osureq.exe.
      # Resource versions must be plain x.y.z, so dev builds use 0.0.0 there.
      - name: Build
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            go vet ./...; if ($LASTEXITCODE) { exit $LASTEXITCODE }
            go test ./...; if ($LASTEXITCODE) { exit $LASTEXITCODE }
            go run ./tools/winres -version 0.0.0; if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:CGO_ENABLED = "0"
            New-Item -ItemType Directory -Force dist | Out-Null
            go build -trimpath -ldflags "-X main.version=$v" -o dist\osureq.exe .
            exit $LASTEXITCODE
          }
          ./build.ps1 -Version $v

      - name: Package
        id: pkg
        run: |
          $name = "osureq-${{ steps.ver.outputs.version }}-windows-x64".Replace("+", "-")
          Compress-Archive -Path dist\osureq.exe, LICENSE, THIRD_PARTY_LICENSES.txt -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256
          retention-days: 14

  release:
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        # --target creates the tag on this commit when it does not exist yet (Run workflow).
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "osureq ${TAG#v}" \
            --notes "Download osureq-${TAG#v}-windows-x64.zip, unzip it and run osureq.exe. See the README for setup (TikFinity and tosu are required) and the Changelog for what changed."
