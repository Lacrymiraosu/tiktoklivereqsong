<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1726">
<meta name="robots" content="noindex">
<title>osureq mod panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=Varela+Round&display=swap" rel="stylesheet">
<style>
/* Same palette as the dashboard; made for a phone held in one hand. */
:root{--bg:#1c1726;--bg2:#241d33;--panel:#2d2540;--line:#443a5a;--ink:#f3eefb;--dim:#b3a8cc;--pink:#ff66aa;--pinkdk:#2a0f1f;--sky:#66ccff;--ok:#57d68d;--warn:#ffcf6b;--err:#ff5a6e;
  font-family:"Varela Round","IBM Plex Sans Thai",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#665c80;display:inline-block}
.dot.green{background:var(--ok)}.dot.yellow{background:var(--warn)}.dot.red{background:var(--err)}
.pills{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45}
.btn.main{background:var(--pink);border-color:var(--pink);color:var(--pinkdk);font-weight:600}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.card{border-radius:18px;border:1px solid var(--line);background:var(--panel);padding:14px}
.lab{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--pink)}
.np b{display:block;font-size:19px;margin-top:4px;overflow-wrap:anywhere}
.np .sub{font-size:14px;color:var(--dim);overflow-wrap:anywhere}
.np .acts{display:flex;gap:8px;margin-top:12px}
.np .acts .btn{flex:1}
.np .acts .btn.main{flex:2}
.np .acts .btn.pv,.np .acts .btn.prev{flex:0 0 auto}
.btn.pv{min-width:44px;font-size:16px}
.btn.pv.on{background:var(--sky);border-color:var(--sky);color:#0d2233}
.req{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:var(--pink)}.switch:checked::after{transform:translateX(22px)}
.list{display:flex;flex-direction:column;gap:8px}
.row{border-radius:14px;border:1px solid var(--line);background:var(--bg2);padding:10px 12px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px}
.row .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--pink);color:var(--pinkdk)}
.row .n.prio{background:var(--warn)}
.row .t,.row .m{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .t{font-size:15px;-webkit-line-clamp:2}
.row .m{grid-column:2;font-size:12px;color:var(--dim);-webkit-line-clamp:1}
.row .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.mods{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-right:6px;vertical-align:1px;background:var(--pink);color:var(--pinkdk)}
.star{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;color:#1c1726;margin-right:6px;vertical-align:1px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:18px 0}
.login{margin-top:12vh}
.login input{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);padding:0 16px;font-size:24px;letter-spacing:6px;text-align:center}
.login p{color:var(--dim);font-size:14px;line-height:1.5}
.err{color:var(--err);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;transition:.25s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:var(--err)}
h2{font-size:14px;color:var(--pink);margin:6px 0 0}
/* ▶ view map: KIKI's beatmap player folds out under the row, full width, 16:10, one at a time */
.row .acts{flex-wrap:wrap;justify-content:space-between}
.row .acts .grp{display:flex;gap:6px;margin-left:auto}
.kk{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--pink);font-size:14px;cursor:pointer;white-space:nowrap}
.kk.on{background:var(--pink);border-color:var(--pink);color:var(--pinkdk);font-weight:600}
.np .kk{margin-top:10px}
.kiki{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease,margin .25s ease}
.kiki.open{grid-template-rows:1fr}
.kiki-in{min-height:0;overflow:hidden}
.kiki-frame{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:#000}
.kiki-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.list>.kiki{margin-top:-8px}.list>.kiki.open{margin-top:-4px}
#np+.kiki.open{margin-top:8px}
@media (prefers-reduced-motion:reduce){.kiki{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="title">osureq mod panel</h1>
    <button class="btn sm ghost" id="lang" type="button">ไทย</button>
    <button class="btn sm ghost" id="logout" type="button" hidden></button></div>

  <form class="card login" id="loginForm" hidden autocomplete="off">
    <p id="loginText"></p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="one-time-code" aria-label="PIN">
    <div class="err" id="loginErr"></div>
    <button class="btn main" type="submit" id="loginBtn" style="width:100%"></button>
  </form>

  <div id="main" hidden>
    <div class="card req"><div><b id="reqLabel"></b><div class="pills"><span><i class="dot" id="tfDot"></i> <span id="tfName">TikFinity</span> <span id="tfViewers" hidden></span></span><span><i class="dot" id="tosuDot"></i> tosu</span></div></div>
      <input type="checkbox" class="switch" id="reqSw" aria-labelledby="reqLabel"></div>
    <div class="card np" id="np"></div>
    <h2 id="queueTitle"></h2>
    <div class="list" id="queue"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const TX = {
  title: ["osureq mod panel", "แผงม็อด osureq"], login: ["Sign in", "เข้าสู่ระบบ"], logout: ["Sign out", "ออก"],
  loginText: ["Enter the PIN from osureq on the streamer's PC (Settings → Mod panel).", "ใส่ PIN จาก osureq บนเครื่องสตรีมเมอร์ (ตั้งค่า → แผงม็อด)"],
  wrong_pin: ["Wrong PIN", "PIN ไม่ถูกต้อง"], locked: ["Too many wrong PINs. Try again in {n} min.", "ใส่ PIN ผิดหลายครั้งเกินไป ลองใหม่ใน {n} นาที"],
  requests: ["Requests", "รับคำขอ"], nowPlaying: ["Now playing", "กำลังเล่น"], nothing: ["Nothing playing", "ยังไม่มีเพลงที่เล่นอยู่"],
  preview: ["Play the preview on the stream PC", "เล่นตัวอย่างเพลงบนคอมสตรีม"], stopPreview: ["Stop the preview", "หยุดตัวอย่างเพลง"],
  next: ["Next", "ถัดไป"], prev: ["Back to {t}", "กลับไป {t}"], skip: ["Skip", "ข้าม"], remove: ["Remove", "ลบ"], up: ["Up", "ขึ้น"], down: ["Down", "ลง"],
  queue: ["Queue ({n})", "คิว ({n})"], empty: ["The queue is empty", "คิวว่าง"], by: ["requested by", "ขอโดย"],
  confirmRemove: ["Remove {t} (@{u})?", "ลบ {t} (@{u})?"], confirmSkip: ["Skip the song being played?", "ข้ามเพลงที่กำลังเล่น?"],
  st_queued: ["waiting", "รอดาวน์โหลด"], st_downloading: ["downloading", "กำลังดาวน์โหลด"], st_ready: ["ready", "พร้อมเล่น"], st_failed: ["failed", "ล้มเหลว"],
  ph_waiting: ["waiting to be played", "รอเริ่มเล่น"], ph_playing: ["playing", "กำลังเล่น"], ph_results: ["results screen", "หน้าผลคะแนน"], ph_ended: ["finished", "เล่นจบแล้ว"],
  kikiOpen: ["view map", "ดูแมพ"], kikiClose: ["close map viewer", "ปิดตัวดูแมพ"], kikiTitle: ["Beatmap player (KIKI Beatmap Viewer)", "ตัวดูแมพ (KIKI Beatmap Viewer)"],
  viewers: ["people watching the LIVE", "ผู้ชมที่กำลังดูไลฟ์"], votes: ["skip votes {v}/{n}", "โหวตข้าม {v}/{n}"], offline: ["Lost connection to osureq", "ขาดการเชื่อมต่อกับ osureq"],
  e_queue_empty: ["The queue is empty", "คิวว่างอยู่"], e_busy: ["Already opening a map", "กำลังเปิดแมพอยู่"], e_not_found: ["That request is gone", "คำขอนี้ไม่อยู่แล้ว"], e_no_previous: ["No map was played before this one", "ยังไม่มีแมพก่อนหน้า"],
};
let LANG = (navigator.language || "").startsWith("th") ? "th" : "en";
try { LANG = localStorage.getItem("osureq.modLang") || LANG; } catch {}
const tx = (k, v) => { let s = (TX[k] || [k, k])[LANG === "th" ? 1 : 0]; for (const a in v || {}) s = s.replace("{" + a + "}", v[a]); return s; };
let toastT;
function toast(msg, bad) {
  const e = $("#toast"); e.textContent = msg; e.classList.toggle("bad", !!bad); e.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), bad ? 3500 : 1800);
}
function starColor(s) {
  if (s == null || s < 0) return "#8a7fa3";
  const stops = [[0, "#4290fb"], [2, "#4fc0ff"], [2.5, "#4fffd5"], [3.3, "#7cff4f"], [4.2, "#f6f05c"], [4.9, "#ff8068"], [5.8, "#ff4e6f"], [6.7, "#c645b8"], [7.7, "#6563de"], [9, "#18158e"]];
  if (s >= 9) return "#000";
  for (let i = 1; i < stops.length; i++) if (s <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i], f = (s - a) / (b - a);
    const p = c => [1, 3, 5].map(j => parseInt(c.slice(j, j + 2), 16));
    const x = p(ca), y = p(cb);
    return "rgb(" + x.map((v, j) => Math.round(v + (y[j] - v) * f)).join(",") + ")";
  }
  return "#18158e";
}
const modsTag = it => it.mods ? `<span class="mods">+${esc(it.mods)}</span>` : "";
const star = it => `<span class="star" style="background:${starColor(it.stars)};color:${it.stars >= 6.7 ? "#fff" : "#1c1726"}">${it.stars >= 0 ? it.stars.toFixed(2) : "?"}★</span>`;

async function api(method, path, body) {
  let r;
  try {
    r = await fetch(path, { method, headers: { "X-Osureq": "1", "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin" });
  } catch { return { ok: false, offline: true }; }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401 && j.code === "login") { showLogin(); return { ok: false, login: true }; }
  return j;
}
async function act(path, body) {
  const j = await api("POST", path, body);
  if (j.ok === false && !j.login) toast(j.code && TX["e_" + j.code] ? tx("e_" + j.code) : (j.error || "error"), true);
  refresh();
  return j;
}

function applyLang() {
  document.documentElement.lang = LANG;
  $("#lang").textContent = LANG === "th" ? "English" : "ไทย";
  $("#title").textContent = tx("title");
  $("#loginText").textContent = tx("loginText");
  $("#loginBtn").textContent = tx("login");
  $("#logout").textContent = tx("logout");
  $("#reqLabel").textContent = tx("requests");
  if (S) render(S);
}
$("#lang").addEventListener("click", () => { LANG = LANG === "th" ? "en" : "th"; try { localStorage.setItem("osureq.modLang", LANG); } catch {} applyLang(); });

function showLogin() {
  S = null;
  kikiClose();
  $("#main").hidden = true; $("#logout").hidden = true; $("#loginForm").hidden = false;
  setTimeout(() => $("#pin").focus(), 50);
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginBtn").disabled = true;
  const j = await api("POST", "/m/login", { pin: $("#pin").value.trim() });
  $("#loginBtn").disabled = false;
  if (j.ok) { $("#pin").value = ""; $("#loginErr").textContent = ""; $("#loginForm").hidden = true; refresh(); return; }
  $("#loginErr").textContent = j.code === "locked" ? tx("locked", { n: j.minutes }) : j.offline ? tx("offline") : tx("wrong_pin");
});
$("#logout").addEventListener("click", async () => { await api("POST", "/m/logout"); showLogin(); });
$("#reqSw").addEventListener("change", () => act("/m/api/action/toggleRequests"));

let S = null, lastKey = "";

// ▶ view map opens KIKI Beatmap Viewer's player under a row: a plain iframe of player.kiki-bm.app
// (the page's CSP allows framing only that site), which fetches the map from the community
// mirrors by its id. No script from KIKI runs here and nothing is sent to it but the address.
// One player at a time; it stays where it is while the rows around it are redrawn (place).
const KIKI = "https://player.kiki-bm.app";
let kiki = null; // the open player: { key, box, frame }
// kikiMods keeps the mods the player knows (EZ HD HR DT NC HT FL) and, like the player,
// drops the later one of EZ+HR and of DT/NC/HT. "" = no mods.
function kikiMods(mods) {
  const out = [], speed = ["DT", "NC", "HT"];
  for (const m of String(mods || "").toUpperCase().match(/[A-Z0-9]{2}/g) || []) {
    if (!["EZ", "HD", "HR", "FL", ...speed].includes(m) || out.includes(m)) continue;
    if ((m === "EZ" || m === "HR") && out.some(x => x === "EZ" || x === "HR")) continue;
    if (speed.includes(m) && out.some(x => speed.includes(x))) continue;
    out.push(m);
  }
  return out.join("");
}
const okID = n => Number.isInteger(n) && n > 0;
// kikiShows: the button is on (Settings → osu!) and the map is osu!standard, the only mode the player plays.
const kikiShows = it => !!(S && S.kikiPlayer) && it.mode === "osu" && (okID(it.setId) || okID(it.beatmapId));
// kikiURL: /s/{set}?diff={map} (or /b/{map} without a set) with the request's mods, the page's language and osureq's pink.
function kikiURL(it, lang) {
  const q = new URLSearchParams();
  let path = "/b/" + it.beatmapId;
  if (okID(it.setId)) {
    path = "/s/" + it.setId;
    if (okID(it.beatmapId)) q.set("diff", it.beatmapId);
  }
  const mods = kikiMods(it.mods);
  if (mods) q.set("mods", mods);
  const pink = getComputedStyle(document.documentElement).getPropertyValue("--pink").trim();
  q.set("lang", lang);
  q.set("accent", /^#[0-9a-f]{6}$/i.test(pink) ? pink : "#ff66aa");
  q.set("label", "osureq");
  return KIKI + path + "?" + q;
}
function kkBtn(key) {
  const open = !!kiki && kiki.key === key;
  return `<button class="kk${open ? " on" : ""}" type="button" data-kiki-btn="${esc(key)}" aria-expanded="${open}">${open ? "▴ " + tx("kikiClose") : "▶ " + tx("kikiOpen")}</button>`;
}
function syncKiki() {
  document.querySelectorAll("[data-kiki-btn]").forEach(b => {
    const open = !!kiki && kiki.key === b.dataset.kikiBtn;
    b.textContent = open ? "▴ " + tx("kikiClose") : "▶ " + tx("kikiOpen");
    b.setAttribute("aria-expanded", String(open));
    b.classList.toggle("on", open);
  });
}
function kikiToggle(b) {
  const key = b.dataset.kikiBtn, again = !!kiki && kiki.key === key;
  kikiClose();
  if (again || !S) return;
  const id = key.slice(2), now = key.startsWith("n:");
  const it = now ? (S.now && S.now.id === id ? S.now : null) : S.items.find(x => x.id === id);
  const anchor = now ? $("#np") : b.closest(".row");
  if (!it || !anchor || !kikiShows(it)) return;
  const frame = document.createElement("iframe");
  frame.src = kikiURL(it, LANG);
  frame.title = tx("kikiTitle");
  frame.setAttribute("allow", "autoplay; fullscreen");
  frame.setAttribute("loading", "lazy");
  const box = document.createElement("div");
  box.className = "kiki";
  box.innerHTML = '<div class="kiki-in"><div class="kiki-frame"></div></div>';
  box.querySelector(".kiki-frame").append(frame);
  anchor.after(box);
  kiki = { key, box, frame };
  box.addEventListener("transitionend", () => { if (kiki && kiki.box === box) box.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, { once: true });
  requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add("open")));
  syncKiki();
}
function kikiClose() {
  const k = kiki;
  if (!k) return;
  kiki = null;
  k.frame.remove(); // the sound stops at once
  k.box.classList.remove("open");
  setTimeout(() => k.box.remove(), 300);
  syncKiki();
}
// place puts new rows in a list but keeps the open player where it is (moving an iframe reloads
// it): the rows go around it while its own row is still there; otherwise the player closes.
function place(el, html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const nodes = [...tpl.content.children], k = kiki;
  if (k && k.box.parentNode === el) {
    const at = nodes.findIndex(n => n.dataset.kiki === k.key);
    if (at >= 0) {
      for (const c of [...el.children]) if (c !== k.box) c.remove();
      k.box.before(...nodes.slice(0, at + 1));
      k.box.after(...nodes.slice(at + 1));
      return;
    }
    kikiClose();
  }
  el.replaceChildren(...nodes);
}
// pvBtn plays (or stops) the map's preview on the stream PC, through the dashboard there.
function pvBtn(it, playing) {
  const on = it.setId > 0 && it.setId === playing;
  return `<button class="btn sm pv${on ? " on" : ""}" type="button" data-op="preview" aria-label="${tx(on ? "stopPreview" : "preview")}" title="${tx(on ? "stopPreview" : "preview")}">${on ? "❚❚" : "♪"}</button>`;
}
function render(s) {
  $("#loginForm").hidden = true; $("#main").hidden = false; $("#logout").hidden = false;
  $("#reqSw").checked = s.requests;
  $("#tfDot").className = "dot " + s.tikfinity;
  $("#tfName").textContent = s.chatSource === "tiktok" ? "TikTok" : "TikFinity";
  const vw = $("#tfViewers"), viewers = s.viewers > 0 ? s.viewers : 0;
  vw.hidden = !viewers;
  vw.textContent = viewers ? "👁 " + viewers.toLocaleString() : "";
  vw.title = viewers ? tx("viewers") : "";
  $("#tosuDot").className = "dot " + s.tosu;
  const key = JSON.stringify([s.now, s.items, s.voteSkip, s.previewing, s.prev, s.kikiPlayer, LANG]);
  if (key === lastKey) return; // nothing changed: keep the page still under the thumb
  lastKey = key;
  const n = s.now, vs = s.voteSkip || {};
  // the player of now playing sits after the card (a redraw of the card leaves it alone) until another map plays
  if (kiki && kiki.key.startsWith("n:") && (!n || kiki.key !== "n:" + n.id)) kikiClose();
  $("#np").innerHTML = `<div class="lab">${tx("nowPlaying")}</div>` + (n
    ? `<b>${esc(n.title)}</b><div class="sub">${star(n)}${modsTag(n)}${esc(n.artist)} · [${esc(n.version)}]</div>
       <div class="sub">${tx("by")} @${esc(n.user)} · ${tx("ph_" + (n.phase || "waiting"))}${vs.needed > 0 && vs.votes > 0 ? " · " + tx("votes", { v: vs.votes, n: vs.needed }) : ""}</div>${kikiShows(n) ? kkBtn("n:" + n.id) : ""}`
    : `<div class="sub" style="margin-top:6px">${tx("nothing")}</div>`) +
    `<div class="acts" data-id="${n ? esc(n.id) : ""}">${s.prev ? `<button class="btn prev" type="button" data-act="previous" title="${esc(tx("prev", { t: s.prev }))}" aria-label="${esc(tx("prev", { t: s.prev }))}">◀</button>` : ""}${n ? pvBtn(n, s.previewing) : ""}<button class="btn" type="button" data-act="skip"${n ? "" : " disabled"}>${tx("skip")}</button><button class="btn main" type="button" data-act="next">${tx("next")} →</button></div>`;
  $("#queueTitle").textContent = tx("queue", { n: s.items.length });
  place($("#queue"), s.items.length ? s.items.map((it, i) => `<div class="row" data-id="${esc(it.id)}" data-kiki="q:${esc(it.id)}">
      <span class="n${it.priority ? " prio" : ""}">${it.priority ? "★" : i + 1}</span>
      <span class="t">${star(it)}${modsTag(it)}${esc(it.artist)} - ${esc(it.title)}</span>
      <span class="m">@${esc(it.user)} · ${tx("st_" + it.state)} · [${esc(it.version)}]</span>
      <div class="acts">${kikiShows(it) ? kkBtn("q:" + it.id) : ""}<span class="grp">
        ${pvBtn(it, s.previewing)}
        <button class="btn sm" type="button" data-op="up" data-i="${i}"${i === 0 ? " disabled" : ""} aria-label="${tx("up")}">▲</button>
        <button class="btn sm" type="button" data-op="down" data-i="${i}"${i === s.items.length - 1 ? " disabled" : ""} aria-label="${tx("down")}">▼</button>
        <button class="btn sm" type="button" data-op="skip">${tx("skip")}</button>
        <button class="btn sm" type="button" data-op="remove">${tx("remove")}</button></span></div></div>`).join("")
    : `<div class="empty">${tx("empty")}</div>`);
  if (kiki && (!s.kikiPlayer || !kiki.box.isConnected)) kikiClose(); // switched off in Settings, or its row is gone
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.kikiBtn) { kikiToggle(b); return; }
  if (b.dataset.act) {
    if (b.dataset.act === "skip" && !confirm(tx("confirmSkip"))) return;
    b.disabled = true;
    await act("/m/api/action/" + b.dataset.act);
    b.disabled = false;
    return;
  }
  const row = b.closest("[data-id]"); // a queue row, or the now-playing buttons
  if (!row || !b.dataset.op || !S) return;
  const id = row.dataset.id, it = S.items.find(x => x.id === id) || (S.now && S.now.id === id ? S.now : null);
  if (!it) return;
  const op = b.dataset.op;
  if (op === "remove" && !confirm(tx("confirmRemove", { t: it.title, u: it.user }))) return;
  if (op === "up" || op === "down") await act(`/m/api/queue/${encodeURIComponent(id)}/move`, { to: +b.dataset.i + (op === "up" ? -1 : 1) });
  else await act(`/m/api/queue/${encodeURIComponent(id)}/${op}`);
});

let offlineShown = false;
async function refresh() {
  const j = await api("GET", "/m/api/state");
  if (j.offline) { if (!offlineShown) toast(tx("offline"), true); offlineShown = true; return; }
  offlineShown = false;
  if (j.login || j.ok === false) return;
  S = j;
  render(j);
}
applyLang();
refresh();
setInterval(() => { if (!document.hidden && $("#loginForm").hidden) refresh(); }, 2500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
